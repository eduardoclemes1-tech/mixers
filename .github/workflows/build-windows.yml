name: Build & Release Mixers Windows (WPF .NET 8)

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publicar Mixers.exe nativo (WPF + NAudio)
        run: |
          dotnet publish MixersWpf/Mixers.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o dist

      - name: Empacotar Mixers-Windows.zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/pkg/Mixers | Out-Null
          Copy-Item dist/Mixers.exe dist/pkg/Mixers/Mixers.exe
          Compress-Archive -Path dist/pkg/Mixers -DestinationPath dist/Mixers-Windows.zip -Force

      - name: Publicar artefato Mixers-Windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: Mixers-Windows-ZIP
          path: dist/Mixers-Windows.zip

      - name: Publicar GitHub Release (para Auto-Update)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Mixers.exe
            dist/Mixers-Windows.zip
