# Copie este arquivo para .github/workflows/build-windows.yml no GitHub
# para gerar automaticamente o Mixers-Windows.zip a cada push!

name: Build Mixers Windows ZIP

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Rodar testes unitários
        run: python -m unittest discover -s tests -v

      - name: Gerar Mixers.exe e Mixers-Windows.zip
        run: |
          pyinstaller --noconfirm --onefile --windowed --name Mixers --collect-all customtkinter --hidden-import pystray._win32 main.py
          python scripts/make_zip.py

      - name: Publicar Mixers-Windows.zip
        uses: actions/upload-artifact@v4
        with:
          name: Mixers-Windows-ZIP
          path: dist/Mixers-Windows.zip
